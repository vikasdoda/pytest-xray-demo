name: CI - Pytest to Xray

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest (generate JUnit XML)
        run: |
          mkdir -p results
          pytest --junitxml=results/junit.xml

      - name: Debug - show JUnit file
        run: |
          echo "=== Repo root ==="
          ls -la
          echo "=== results folder ==="
          ls -la results || true
          test -f results/junit.xml && echo "FOUND junit.xml" || (echo "MISSING junit.xml" && exit 1)
          echo "=== junit.xml size (bytes) ==="
          wc -c results/junit.xml
          echo "=== junit.xml first 30 lines ==="
          head -n 30 results/junit.xml

      - name: Authenticate to Xray Cloud (get token)
        id: xray_auth
        run: |
          TOKEN=$(curl --fail-with-body -sS -H "Content-Type: application/json" \
            -X POST https://xray.cloud.getxray.app/api/v2/authenticate \
            -d "{\"client_id\":\"${{ secrets.XRAY_CLIENT_ID }}\",\"client_secret\":\"${{ secrets.XRAY_CLIENT_SECRET }}\"}" \
            | tr -d '"')
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Import JUnit into Xray (existing Test Execution)
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer ${{ steps.xray_auth.outputs.token }}" \
            -H "Content-Type: text/xml" \
            --data-binary "@results/junit.xml" \
            "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=${{ secrets.XRAY_PROJECT_KEY }}&testExecKey=${{ secrets.XRAY_TEST_EXEC_KEY }}"

